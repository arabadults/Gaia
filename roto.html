<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف الحصريات | VIP</title>
    
    <style>
        :root {
            --tg-color: #24A1DE;
            --gold: #ffcc00;
            --bg-black: #0f0f0f;
            --card-bg: #161616;
        }

        body {
            background-color: var(--bg-black);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* --- تصميم النافذة المنبثقة (Premium Modal) --- */
        #premium-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none; /* مخفية افتراضياً */
            align-items: center;
            justify-content: center;
        }

        .premium-card {
            background: #1a1a1a;
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 40px 20px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.2);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .premium-card h2 { color: var(--gold); margin-top: 0; }
        .premium-card p { color: #ccc; font-size: 1.1rem; margin-bottom: 25px; }

        .price-tag {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px dashed var(--gold);
        }

        .btn-pay {
            background: var(--gold);
            color: black;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .btn-pay:hover { background: #fff; transform: scale(1.05); }

        /* --- باقي التنسيقات الأصلية --- */
        header { background: #1a1a1a; padding: 20px; text-align: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .logo-text { color: var(--gold); font-weight: 900; font-size: 1.4rem; }
        .container { padding: 15px; max-width: 700px; margin: auto; }
        .v-card { background: var(--card-bg); border-radius: 15px; margin-bottom: 25px; overflow: hidden; border: 1px solid #333; }
        .v-info { padding: 15px; font-weight: bold; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; }
        video { width: 100%; display: block; background: #000; }
    </style>
</head>
<body>

<div id="premium-overlay">
    <div class="premium-card">
        <div style="font-size: 4rem; margin-bottom: 10px;">👑</div>
        <h2>انتهت فترة المشاهدة المجانية!</h2>
        <p>لإكمال مشاهدة الأرشيف الحصري (أكثر من 14,000 مقطع بدقة 4K)، يرجى تفعيل الاشتراك المدفوع.</p>
        
        <div class="price-tag">
            <div style="font-size: 0.8rem; color: #aaa;">عرض لمرة واحدة</div>
            <div style="font-size: 1.5rem; font-weight: bold;">إشتراك VIP الأبدي</div>
        </div>

        <a href="https://t.me/mimalmada_" target="_blank" class="btn-pay">تواصل معي للتفعيل الآن</a>
        <div style="margin-top: 15px; font-size: 0.8rem; color: #666;">سيتم الرد عليك فوراً لتزويدك بطرق الدفع</div>
    </div>
</div>

<header>
    <div class="logo-text">🌟 أرشيف الحصريات المميز 🌟</div>
</header>

<div class="container">
    <div class="v-card">
        <div class="v-info">المقطع المسرب #1 (4K)</div>
        <video id="v1" controls playsinline>
            <source src="https://media.discordapp.net/attachments/1134630020162269298/1472885274047418401/VID_20260216_111844.mp4?ex=699432ce&is=6992e14e&hm=58af755808107ddd378d7532a9c0641aab818b1d9017d7f3f46aec15e2f0e673&" type="video/mp4">
        </video>
    </div>

    </div>

<script>
    // تفعيل الستارة بعد 10 ثوانٍ
    setTimeout(function() {
        const overlay = document.getElementById('premium-overlay');
        overlay.style.display = 'flex';
        
        // إيقاف جميع الفيديوهات التي تعمل
        const videos = document.getElementsByTagName('video');
        for(let v of videos) {
            v.pause();
        }

        // منع إغلاق الستارة بالنقر خارجها لضمان الدفع
        overlay.onclick = function(e) {
            if (e.target === overlay) {
                alert("يرجى الاشتراك لمتابعة المحتوى.");
            }
        };
    }, 10000); // 10000 ميلي ثانية = 10 ثوانٍ
</script>

</body>
</html>
